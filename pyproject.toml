[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ikgpc"
version = "1.0.0"
description = "Indicator kriging as a first-order approximation of softmax Gaussian process classification: reproduction code"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yupeng Li"}, {name = "Jianing You"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4", "matplotlib>=3.5"]
keywords = ["indicator kriging", "Gaussian process classification", "geostatistics", "softmax", "Laplace approximation"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Topic :: Scientific/Engineering :: GIS", "Topic :: Scientific/Engineering :: Mathematics"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
